<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Overview</p>
          <h1>Expense Tracker</h1>
        </div>
        <span class="chip">This month</span>
      </header>

      <main class="layout">
        <section class="panel form-panel" aria-labelledby="add-expense-heading">
          <h2 id="add-expense-heading">Add expense</h2>

          <form id="expense-form" class="expense-form">
            <div class="field">
              <label for="description">Description</label>
              <input
                type="text"
                id="description"
                name="description"
                placeholder="e.g. Groceries"
                required
              />
            </div>

            <div class="field">
              <label for="amount">Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="" selected disabled>Select a category</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="shopping">Shopping</option>
                <option value="bills">Bills</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
              </select>
            </div>

            <button type="submit">Add expense</button>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="expenses-heading">
          <div class="panel-header">
            <h2 id="expenses-heading">Recent expenses</h2>

            <select id="filter" name="filter" class="mini-select">
              <option value="all">All</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="shopping">Shopping</option>
              <option value="bills">Bills</option>
              <option value="entertainment">Entertainment</option>
              <option value="other">Other</option>
            </select>
          </div>

          <ul id="expense-list" class="expense-list" aria-live="polite">
            
          </ul>

          <p id="empty-message" class="empty-message">No expenses added yet.</p>
          <div class="total-box">
            <span>Total</span>
            <strong>$<span id="total-expenses">$0.00</span></strong>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
